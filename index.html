<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>

        <div class="search-bar">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
            <button id="location-btn" title="Use my location">📍</button>
            <button id="unit-toggle" title="Toggle °C / °F">°C</button>
        </div>

        <div id="recent-searches" class="recent-searches hidden">
            <span class="recent-label">Recent:</span>
            <div id="recent-list" class="recent-list"></div>
        </div>

        <div id="error-message" class="error hidden"></div>
        <div id="loading" class="loading hidden">Loading...</div>

        <section id="current-weather" class="current-weather hidden">
            <div class="weather-card">
                <h2 id="city-name"></h2>
                <div class="weather-main">
                    <span id="weather-icon" class="weather-emoji-large"></span>
                    <div class="temp-info">
                        <span id="temperature" class="temperature"></span>
                        <span id="description" class="description"></span>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail">
                        <span class="label">Humidity</span>
                        <span id="humidity" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Wind</span>
                        <span id="wind" class="value"></span>
                    </div>
                    <div class="detail">
                        <span class="label">Feels Like</span>
                        <span id="feels-like" class="value"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="hourly-forecast" class="hourly-forecast hidden">
            <h2>Next 24 Hours</h2>
            <div id="hourly-scroll" class="hourly-scroll"></div>
        </section>

        <section id="forecast" class="forecast hidden">
            <h2>5-Day Forecast</h2>
            <div id="forecast-grid" class="forecast-grid"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
